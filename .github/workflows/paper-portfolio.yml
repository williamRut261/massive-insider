name: Massive Insider - PAPER conviction rebalancing v0.6

on:
  # Two daily checks near 10 AM and 2 PM Houston time (America/Chicago).
  # GitHub cron is UTC; all seasonal UTC slots are listed below, and the first
  # step runs the cycle only when the actual Houston hour is 10 or 14.
  # The :17 offset avoids GitHub's documented top-of-hour schedule congestion.
  # 10 AM CT is 11 AM ET and is eligible for regular-session execution.
  # 2 PM CT is about 43 minutes before the 3 PM Houston regular-session close.
  # GitHub schedule delivery can still be delayed or skipped.
  schedule:
    - cron: '17 15,16,19,20 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: massive-insider-paper-portfolio
  cancel-in-progress: false

jobs:
  paper-portfolio:
    # Two-gate PAPER opt-in: repo variable plus dedicated secrets.
    if: ${{ vars.MI_PAPER_AUTOMATION_ENABLED == 'YES' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Select the intended Houston-time schedule slot
        id: slot
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "schedule" ]]; then
            echo "run_cycle=true" >> "$GITHUB_OUTPUT"
          else
            local_hour="$(TZ=America/Chicago date +%H)"
            if [[ "$local_hour" == "10" || "$local_hour" == "14" ]]; then
              echo "run_cycle=true" >> "$GITHUB_OUTPUT"
              echo "Houston schedule hour accepted: $local_hour"
            else
              echo "run_cycle=false" >> "$GITHUB_OUTPUT"
              echo "Ignoring duplicate UTC slot; Houston local hour is $local_hour"
            fi
          fi
      - uses: actions/checkout@v4
        if: steps.slot.outputs.run_cycle == 'true'
      - uses: actions/setup-python@v5
        if: steps.slot.outputs.run_cycle == 'true'
        with:
          python-version: '3.11'
      - name: Run safety regression tests offline
        if: steps.slot.outputs.run_cycle == 'true'
        run: python -m unittest discover -s tests -q
      - name: Scan purchases and sales, score convictions and rebalance PAPER (v0.6)
        if: steps.slot.outputs.run_cycle == 'true'
        env:
          MASSIVE_API_KEY: ${{ secrets.MI_MASSIVE_API_KEY }}
          MI_ALPACA_PAPER_KEY_ID: ${{ secrets.MI_ALPACA_PAPER_KEY_ID }}
          MI_ALPACA_PAPER_SECRET_KEY: ${{ secrets.MI_ALPACA_PAPER_SECRET_KEY }}
          MI_PAPER_ACCOUNT_ID: ${{ vars.MI_PAPER_ACCOUNT_ID }}
          MI_PAPER_AUTO_ENABLED: ${{ secrets.MI_PAPER_AUTO_ENABLED }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MASSIVE_API_KEY:?Missing Massive secret}"
          test -n "${MI_ALPACA_PAPER_KEY_ID:?Missing PAPER key ID}"
          test -n "${MI_ALPACA_PAPER_SECRET_KEY:?Missing PAPER secret}"
          test -n "${MI_PAPER_ACCOUNT_ID:?Missing dedicated PAPER account ID}"
          test "${MI_PAPER_AUTO_ENABLED:-}" = "I-ENABLE-PAPER-AUTO"
          python -m insider rebalance-cycle --execute \
            --output reports/rebalance_latest.json

# No code write permissions, no artifacts containing credentials, no LIVE access.
