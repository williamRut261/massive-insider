name: Massive Insider - PAPER conviction rebalancing v0.6

on:
  # Explicit UTC schedule for both US standard and daylight time,
  # avoiding scheduler timezone ambiguity. Early/late UTC slots are NO-OP.
  # Real NY exchange time + PAPER market-open clock are enforced in Python.
  # During EST: eligible 14:52-20:37 UTC; during EDT: 13:52-19:37 UTC.
  # GitHub schedule delivery can be delayed/skipped; no trading after hours.
  schedule:
    - cron: '52 13 * * 1-5'
    - cron: '7,22,37,52 14-19 * * 1-5'
    - cron: '7,22,37 20 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: massive-insider-paper-portfolio
  cancel-in-progress: false

jobs:
  paper-portfolio:
    # Explicit TWO-GATE opt-in: repository variable and dedicated secret.
    # This remains SKIPPED until user enables it after reviewing setup.
    if: ${{ vars.MI_PAPER_AUTOMATION_ENABLED == 'YES' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run safety regression tests offline
        run: python -m unittest discover -s tests -q
      - name: Scan purchases and sales, score convictions and rebalance PAPER (v0.6)
        env:
          MASSIVE_API_KEY: ${{ secrets.MI_MASSIVE_API_KEY }}
          MI_ALPACA_PAPER_KEY_ID: ${{ secrets.MI_ALPACA_PAPER_KEY_ID }}
          MI_ALPACA_PAPER_SECRET_KEY: ${{ secrets.MI_ALPACA_PAPER_SECRET_KEY }}
          MI_PAPER_ACCOUNT_ID: ${{ vars.MI_PAPER_ACCOUNT_ID }}
          MI_PAPER_AUTO_ENABLED: ${{ secrets.MI_PAPER_AUTO_ENABLED }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MASSIVE_API_KEY:?Missing Massive secret}"
          test -n "${MI_ALPACA_PAPER_KEY_ID:?Missing PAPER key ID}"
          test -n "${MI_ALPACA_PAPER_SECRET_KEY:?Missing PAPER secret}"
          test -n "${MI_PAPER_ACCOUNT_ID:?Missing dedicated PAPER account ID}"
          test "${MI_PAPER_AUTO_ENABLED:-}" = "I-ENABLE-PAPER-AUTO"
          python -m insider rebalance-cycle --execute \
            --output reports/rebalance_latest.json

# No code write permissions, no artifacts containing credentials, no LIVE access.
