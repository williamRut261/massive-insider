name: Massive Insider - guarded PAPER portfolio

on:
  # 09:45 EST / 09:45 EDT respectively; second UTC run can be 10:45 EDT.
  # The bot checks the actual NYSE paper market clock before ANY order.
  schedule:
    - cron: '45 13 * * 1-5'
    - cron: '45 14 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: massive-insider-paper-portfolio
  cancel-in-progress: false

jobs:
  paper-portfolio:
    # Explicit TWO-GATE opt-in: repository variable and dedicated secret.
    # This remains SKIPPED until user enables it after reviewing setup.
    if: ${{ vars.MI_PAPER_AUTOMATION_ENABLED == 'YES' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run safety regression tests offline
        run: python -m unittest discover -s tests -q
      - name: Scan fresh Form 4 and manage dedicated PAPER account (opt-in only)
        env:
          MASSIVE_API_KEY: ${{ secrets.MI_MASSIVE_API_KEY }}
          MI_ALPACA_PAPER_KEY_ID: ${{ secrets.MI_ALPACA_PAPER_KEY_ID }}
          MI_ALPACA_PAPER_SECRET_KEY: ${{ secrets.MI_ALPACA_PAPER_SECRET_KEY }}
          MI_PAPER_ACCOUNT_ID: ${{ vars.MI_PAPER_ACCOUNT_ID }}
          MI_PAPER_AUTO_ENABLED: ${{ secrets.MI_PAPER_AUTO_ENABLED }}
        run: |
          python -m insider portfolio-cycle --execute \
            --output reports/portfolio_latest.json

# No code write permissions, no artifacts containing credentials, no LIVE access.
